server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**
        - id: lms-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/courses/**, /api/v1/lessons/**
        - id: dsa-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/problems/**, /api/v1/submissions/**
